name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-assets:
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: mishmash-io/github-workflows/.github/workflows/maven_build_with_provenance.yml@b4bbf8be1c9f467861d4a8ce2fe28bfaa715f933
    secrets: inherit
    with:
      java-version: 21
