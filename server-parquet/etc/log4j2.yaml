Configuration:
  Properties:
    Property:
      - name: "otlp-server-parquet.console.threshold"
        value: "INFO"
  Appenders:
    Console:
      name: "CONSOLE"
      PatternLayout:
        pattern: "%d{ISO8601} - %-5p [%t:%C{1}@%L] - %m%n"
  Loggers:
    Root:
      level: "INFO"
      AppenderRef:
        - ref: "CONSOLE"
          level: "${otlp-server-parquet.console.threshold}"
